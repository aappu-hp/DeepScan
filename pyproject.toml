[project]
name = "agentic-scanner-01"
version = "0.1.0"
description = "Add your description here"
authors = [{name="Appu H P", email="appuhp9844@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12.15",
    "beautifulsoup4>=4.13.4",
    "lxml>=6.0.0",
    "pyyaml>=6.0.2",
    "rich>=14.1.0",
    "tldextract>=5.3.0",
    "typer>=0.16.0",
    "pyfiglet>=1.0.4",
    "questionary>=2.1.1",
    "requests>=2.32.5",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
deepscan = "src.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyright]
extraPaths = ["."]
executionEnvironments = [
  { root = "." }
]
